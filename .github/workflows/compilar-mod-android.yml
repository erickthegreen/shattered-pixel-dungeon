name: Compilar APK - Shattered Dungeon Personalizado

on:
  push:
    branches:
      - mod/aneis-e-pergaminhos
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :android:assembleDebug --no-daemon --stacktrace
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Shattered-Dungeon-Personalizado-APK
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
