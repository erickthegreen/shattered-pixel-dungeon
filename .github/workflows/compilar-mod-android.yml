name: Compilar APK - Shattered Dungeon Personalizado

on:
  push:
    branches:
      - mod/aneis-e-pergaminhos
      - mod/edicao-infernal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # O runner ubuntu-latest ja inclui Android SDK. A acao setup-android@v3
      # falha tentando instalar o pacote legado "tools", removido do repositorio.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :android:assembleDebug --no-daemon --stacktrace
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Shattered-Dungeon-Personalizado-APK
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
