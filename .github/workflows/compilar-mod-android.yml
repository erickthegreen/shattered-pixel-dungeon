name: Compilar APK - Shattered Dungeon Personalizado

on:
  push:
    branches:
      - mod/aneis-e-pergaminhos
      - mod/edicao-infernal
      - mod/edicao-infernal-builds
      - mod/infernal-especiais-estavel
      - mod/tibia-1-jogavel
      - mod/tibia-2-equilibrio-25-andar
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # O runner ubuntu-latest ja inclui Android SDK. A acao setup-android@v3
      # falha tentando instalar o pacote legado "tools", removido do repositorio.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :android:assembleDebug --no-daemon --stacktrace

      - name: Habilitar aceleracao KVM para emulador Android
        if: github.ref == 'refs/heads/mod/infernal-especiais-estavel' || github.ref == 'refs/heads/mod/tibia-1-jogavel' || github.ref == 'refs/heads/mod/tibia-2-equilibrio-25-andar'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testar APK de verdade num emulador Android
        if: github.ref == 'refs/heads/mod/infernal-especiais-estavel' || github.ref == 'refs/heads/mod/tibia-1-jogavel' || github.ref == 'refs/heads/mod/tibia-2-equilibrio-25-andar'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash .github/scripts/verificar-infernal-android.sh

      - name: Testar a edicao no Android 16 (API 36)
        if: github.ref == 'refs/heads/mod/infernal-especiais-estavel' || github.ref == 'refs/heads/mod/tibia-1-jogavel' || github.ref == 'refs/heads/mod/tibia-2-equilibrio-25-andar'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: INFERNAL_SMOKE_FAST=true bash .github/scripts/verificar-infernal-android.sh

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Shattered-Dungeon-Personalizado-APK
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar Tibia 2.0 apenas apos testes Android 11 e 16
        if: github.ref == 'refs/heads/mod/tibia-2-equilibrio-25-andar'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tibia-2-25-andares"
          APK="android/build/outputs/apk/debug/android-debug.apk"
          NOTES="Tibia x Shattered 2.0: 22 criaturas com novos sprites em pixel art, criaturas e chefes tematicos do 1 ao 25, equipamento inicial equilibrado (armadura/armas +2, dois aneis +1), 100 pocoes de XP, 8 trinkets +2, ataques inimigos com dano real, arenas seguras nos chefes 5 e 10. Teste automatico em Android 11 e 16."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --latest --title "Tibia x Shattered 2.0 - 25 Andares" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Tibia x Shattered 2.0 - 25 Andares" --notes "$NOTES" --latest
          fi

      - name: Publicar edicao estavel APENAS apos testes Android
        if: github.ref == 'refs/heads/mod/infernal-especiais-estavel'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="infernal-especiais-estavel"
          APK="android/build/outputs/apk/debug/android-debug.apk"
          NOTES="Edicao Infernal corrigida: somente variantes especiais no spawn normal; 6 a 12 inimigos por andar e respawn controlado; XP equivalente aos monstros substituidos; arma/aneis por classe, 17 amuletos +1000; 30x HP, 9x dano, 8x defesa. Verificacao automatizada de geracao, inventarios e execucao no emulador Android."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --latest --title "Infernal - Somente Especiais (corrigida)" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Infernal - Somente Especiais (corrigida)" \
              --notes "$NOTES" --latest
          fi

      - name: Publicar Tibia 1.0 apos testes Android 11 e 16
        if: github.ref == 'refs/heads/mod/tibia-1-jogavel'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tibia-1-andares-1-5"
          APK="android/build/outputs/apk/debug/android-debug.apk"
          NOTES="Tibia x Shattered: Rat, Rotworm, Carrion Worm, Troll, Minotaur, Slime, chefe Dead Slime e zona segura, XP, oito amuletos +1000 e 100 pocoes de experiencia. Dificuldade 15x HP, 6x dano e 5x defesa/precisao/esquiva. Testado em emuladores Android 11 e 16."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --latest --title "Tibia x Shattered 1.0 - Andares 1-5" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Tibia x Shattered 1.0 - Andares 1-5" --notes "$NOTES" --latest
          fi

      - name: Publicar APK direto na pagina Releases
        if: github.ref == 'refs/heads/mod/edicao-infernal-builds'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="infernal-builds"
          ASSET="android/build/outputs/apk/debug/android-debug.apk#Shattered-Dungeon-Infernal-Builds.apk"
          NOTES="Compilado do commit $GITHUB_SHA. Builds por classe, 17 amuletos +1000, 12 aneis, monstros com 30x vida, 9x dano, 8x defesa e populacao 20x. APK debug pode exigir desinstalacao por divergencia de assinatura."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --latest --title "Shattered Dungeon - Edicao Infernal" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Shattered Dungeon - Edicao Infernal" \
              --notes "$NOTES" \
              --latest
          fi
